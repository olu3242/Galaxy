  <text x="347" y="667" fill="#6b6b8a" font-size="9" text-anchor="middle">Real-Time Metrics</text>
  <text x="347" y="681" fill="#6b6b8a" font-size="9" text-anchor="middle">KPI · Forecast · Trends</text>

  <rect x="460" y="610" width="195" height="80" rx="10" fill="#0d0d1f" stroke="#00ff9d" stroke-width="1.5"/>
