  <text x="695" y="768" fill="#6b6b8a" font-size="9" text-anchor="middle">File Storage · Media</text>

  <rect x="830" y="725" width="180" height="55" rx="8" fill="#0d0d1f" stroke="#7b2fff" stroke-width="1"/>
