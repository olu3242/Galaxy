  <rect x="940" y="322" width="180" height="34" rx="6" fill="#0d0d1f" stroke="#ff2d78" stroke-width="1"/>
  <text x="1030" y="344" fill="#ff2d78" font-size="11" text-anchor="middle">Workflow Runtime</text>

  <!-- Arrow -->
  <line x1="600" y1="370" x2="600" y2="390" stroke="#00e5ff" stroke-width="2" opacity="0.5"/>

