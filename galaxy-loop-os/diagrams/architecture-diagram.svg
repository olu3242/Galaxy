  <text x="557" y="653" fill="#6b6b8a" font-size="9" text-anchor="middle">7 AI Agents (Claude API)</text>
  <text x="557" y="667" fill="#6b6b8a" font-size="9" text-anchor="middle">Permission-Bound Actions</text>
  <text x="557" y="681" fill="#6b6b8a" font-size="9" text-anchor="middle">Full Telemetry + Audit</text>

  <!-- LOOP OS - HIGHLIGHTED -->
