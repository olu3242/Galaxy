  <text x="445" y="768" fill="#6b6b8a" font-size="9" text-anchor="middle">Cache · Queue · Sessions</text>

  <rect x="580" y="725" width="230" height="55" rx="8" fill="#0d0d1f" stroke="#f0c040" stroke-width="1"/>
