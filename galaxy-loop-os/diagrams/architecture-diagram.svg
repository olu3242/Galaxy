  <text x="820" y="655" fill="#00e5ff" font-size="9" text-anchor="middle">→</text>
  <text x="870" y="655" fill="#6b6b8a" font-size="9" text-anchor="middle">Learn</text>
  <text x="925" y="655" fill="#00e5ff" font-size="9" text-anchor="middle">→</text>
  <text x="975" y="655" fill="#6b6b8a" font-size="9" text-anchor="middle">Optimize</text>
  <text x="1038" y="655" fill="#00e5ff" font-size="9" text-anchor="middle">→</text>
  <text x="1090" y="655" fill="#6b6b8a" font-size="9" text-anchor="middle">Repeat</text>
  <text x="915" y="675" fill="#7b2fff" font-size="9" text-anchor="middle">Loop Registry · Loop Runtime · Verification Engine · Learning Engine · Optimization Engine</text>
  <text x="915" y="685" fill="#7b2fff" font-size="8" text-anchor="middle">Galaxy's Core Moat — Self-Improving Platform</text>

  <!-- DATA LAYER -->
  <text x="600" y="718" fill="#6b6b8a" font-size="9" text-anchor="middle" letter-spacing="2">DATA LAYER</text>
