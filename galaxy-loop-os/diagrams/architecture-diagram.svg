<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#04040a;font-family:DM Mono,monospace">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#04040a"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="44" fill="white" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="-0.5">GALAXY LOOP OS™ — SYSTEM ARCHITECTURE</text>
  <text x="600" y="66" fill="#6b6b8a" font-size="11" text-anchor="middle" letter-spacing="2">ORGANIZATION OPERATING SYSTEM // MULTI-TENANT // EVENT-DRIVEN // SELF-IMPROVING</text>

  <!-- CLIENT LAYER -->
  <rect x="40" y="90" width="1120" height="80" rx="10" fill="#0d0d1f" stroke="#1e1e40" stroke-width="1"/>
  <text x="600" y="110" fill="#6b6b8a" font-size="9" text-anchor="middle" letter-spacing="2">CLIENT LAYER</text>
  <rect x="80" y="118" width="240" height="40" rx="8" fill="#12122a" stroke="#00e5ff" stroke-width="1"/>
  <text x="200" y="143" fill="#00e5ff" font-size="12" font-weight="bold" text-anchor="middle">📱 WhatsApp (Members)</text>
  <rect x="480" y="118" width="240" height="40" rx="8" fill="#12122a" stroke="#7b2fff" stroke-width="1"/>
  <text x="600" y="143" fill="#7b2fff" font-size="12" font-weight="bold" text-anchor="middle">🖥 Web Dashboard (Mission Ctrl)</text>
  <rect x="880" y="118" width="240" height="40" rx="8" fill="#12122a" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4"/>
  <text x="1000" y="143" fill="#6b6b8a" font-size="12" font-weight="bold" text-anchor="middle">📲 Mobile Admin (PWA)</text>

  <!-- Arrow down -->
  <line x1="600" y1="170" x2="600" y2="195" stroke="#1e1e40" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API GATEWAY -->
  <rect x="40" y="200" width="1120" height="70" rx="10" fill="#0d0d1f" stroke="#1e1e40" stroke-width="1"/>
  <text x="600" y="218" fill="#6b6b8a" font-size="9" text-anchor="middle" letter-spacing="2">API GATEWAY + AUTH</text>
  <rect x="80" y="226" width="200" height="34" rx="6" fill="#12122a" stroke="#00e5ff" stroke-width="1"/>
  <text x="180" y="248" fill="#e8e8f0" font-size="11" text-anchor="middle">WhatsApp Webhook</text>
  <rect x="300" y="226" width="200" height="34" rx="6" fill="#12122a" stroke="#7b2fff" stroke-width="1"/>
  <text x="400" y="248" fill="#e8e8f0" font-size="11" text-anchor="middle">REST API (Fastify)</text>
  <rect x="520" y="226" width="200" height="34" rx="6" fill="#12122a" stroke="#7b2fff" stroke-width="1"/>
  <text x="620" y="248" fill="#e8e8f0" font-size="11" text-anchor="middle">GraphQL (Apollo)</text>
  <rect x="740" y="226" width="180" height="34" rx="6" fill="#12122a" stroke="#f0c040" stroke-width="1"/>
