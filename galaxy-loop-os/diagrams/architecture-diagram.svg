  <text x="920" y="768" fill="#6b6b8a" font-size="9" text-anchor="middle">Embeddings · RAG</text>

  <rect x="1030" y="725" width="130" height="55" rx="8" fill="#0d0d1f" stroke="#00ff9d" stroke-width="1"/>
  <text x="1095" y="750" fill="#e8e8f0" font-size="11" font-weight="bold" text-anchor="middle">Kafka</text>
  <text x="1095" y="768" fill="#6b6b8a" font-size="9" text-anchor="middle">Event Streaming</text>

  <!-- MISSION CONTROL banner -->
