name: RC Format Fix

on:
  push:
    branches:
      - feat/workflow-os-iterations-1-2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-os-iterations-1-2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format RC files
        run: >-
          pnpm exec prettier --write
          apps/api/src/db/migrate.ts
          apps/api/src/db/migrations/101_workflow_step_execution_types.ts
          apps/api/src/db/migrations/102_workflow_execution_receipts.ts
          apps/worker/src/index.ts
          apps/worker/src/lib/__tests__/step-execution.test.ts
          apps/worker/src/lib/__tests__/workflow-dispatch.test.ts
          apps/worker/src/lib/step-execution.ts
          apps/worker/src/lib/workflow-dispatch.ts
          apps/worker/src/processors/__tests__/approval-processing.test.ts
          apps/worker/src/processors/__tests__/intent-detection.test.ts
          apps/worker/src/processors/__tests__/workflow-execution.test.ts
          apps/worker/src/processors/approval-processing.ts
          apps/worker/src/processors/intent-detection.ts
          apps/worker/src/processors/notification-dispatch.ts
          apps/worker/src/processors/workflow-execution.ts
          packages/modules/workflow/src/__tests__/workflow-discovery-runtime.test.ts
          packages/modules/workflow/src/context/ContextIntelligenceEngine.ts
          packages/modules/workflow/src/contracts.ts
          packages/modules/workflow/src/discovery/WorkflowDiscoveryEngine.ts
          packages/modules/workflow/src/runtime/WorkflowRegistry.ts
          packages/modules/workflow/src/runtime/WorkflowRuntime.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/db/migrate.ts \
            apps/api/src/db/migrations/101_workflow_step_execution_types.ts \
            apps/api/src/db/migrations/102_workflow_execution_receipts.ts \
            apps/worker/src/index.ts \
            apps/worker/src/lib/__tests__/step-execution.test.ts \
            apps/worker/src/lib/__tests__/workflow-dispatch.test.ts \
            apps/worker/src/lib/step-execution.ts \
            apps/worker/src/lib/workflow-dispatch.ts \
            apps/worker/src/processors/__tests__/approval-processing.test.ts \
            apps/worker/src/processors/__tests__/intent-detection.test.ts \
            apps/worker/src/processors/__tests__/workflow-execution.test.ts \
            apps/worker/src/processors/approval-processing.ts \
            apps/worker/src/processors/intent-detection.ts \
            apps/worker/src/processors/notification-dispatch.ts \
            apps/worker/src/processors/workflow-execution.ts \
            packages/modules/workflow/src/__tests__/workflow-discovery-runtime.test.ts \
            packages/modules/workflow/src/context/ContextIntelligenceEngine.ts \
            packages/modules/workflow/src/contracts.ts \
            packages/modules/workflow/src/discovery/WorkflowDiscoveryEngine.ts \
            packages/modules/workflow/src/runtime/WorkflowRegistry.ts \
            packages/modules/workflow/src/runtime/WorkflowRuntime.ts
          git commit -m "style(rc): apply repository prettier formatting"
          git push origin HEAD:feat/workflow-os-iterations-1-2
