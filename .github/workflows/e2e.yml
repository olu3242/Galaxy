name: E2E Tests

on:
  push:
    branches: [main, develop, 'sprint/**', 'foundation/**', 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://galaxy:galaxy_test@localhost:5432/galaxy_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: test-jwt-secret-minimum-32-characters-long
  WHATSAPP_APP_SECRET: test-whatsapp-app-secret
  NEXT_PUBLIC_API_URL: http://localhost:3001

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: galaxy
          POSTGRES_PASSWORD: galaxy_test
          POSTGRES_DB: galaxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galaxy -d galaxy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter @galaxy/api db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Seed test database
        run: pnpm --filter @galaxy/api db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Start API server
        run: pnpm --filter @galaxy/api dev &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          WHATSAPP_APP_SECRET: ${{ env.WHATSAPP_APP_SECRET }}
          PORT: 3001
          NODE_ENV: test

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3001/health; then
              echo "API is up after $i attempts"
              exit 0
            fi
            echo "Waiting for API... ($i/45)"
            sleep 3
          done
          echo "API did not start in time" && exit 1

      - name: Install Playwright browsers
        run: pnpm --filter @galaxy/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @galaxy/web test:e2e
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          E2E_TEST_EMAIL: admin@galaxy-test.local
          E2E_TEST_PASSWORD: galaxy-test-password
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
