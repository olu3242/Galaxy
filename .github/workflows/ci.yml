name: CI

on:
  push:
    branches: [main, develop, "sprint/**", "foundation/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Type-check all packages
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (required for type references)
        run: pnpm build --filter=@galaxy/types --filter=@galaxy/config --filter=@galaxy/utils

      - name: Type-check
        run: pnpm typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Unit tests
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@galaxy/types --filter=@galaxy/config --filter=@galaxy/utils

      - name: Run unit tests
        run: pnpm test --filter=@galaxy/types --filter=@galaxy/utils
        env:
          NODE_ENV: test

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Integration tests (requires PostgreSQL + Redis)
  #    Includes the mandatory cross-tenant RLS isolation test.
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (RLS + DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: galaxy
          POSTGRES_PASSWORD: galaxy_test
          POSTGRES_DB: galaxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter @galaxy/api db:migrate
        env:
          DATABASE_URL: postgresql://galaxy:galaxy_test@localhost:5432/galaxy_test
          NODE_ENV: test

      - name: Run integration tests (includes RLS isolation tests)
        run: pnpm --filter @galaxy/api test:ci
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://galaxy:galaxy_test@localhost:5432/galaxy_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          WHATSAPP_APP_SECRET: test-whatsapp-app-secret
          API_BASE_URL: http://localhost:3001
          WEB_BASE_URL: http://localhost:3000

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Build verification — all apps must build successfully
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Secret scanning — ensure no secrets leaked in the diff
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
