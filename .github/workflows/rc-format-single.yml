name: RC Format Single

on:
  push:
    branches:
      - feat/workflow-os-iterations-1-2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workflow-os-iterations-1-2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format residual test
        run: pnpm exec prettier --write apps/worker/src/lib/__tests__/step-execution.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/lib/__tests__/step-execution.test.ts
          git commit --no-verify -m "style(worker): format step execution test"
          git push origin HEAD:feat/workflow-os-iterations-1-2
